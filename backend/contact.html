<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Star Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background: #c41e3a;
            top: -180px;
            left: -120px;
        }

        body::after {
            background: #8b0000;
            bottom: -200px;
            right: -80px;
        }

        .contact-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: #141414;
            border-radius: 16px;
            padding: 32px 28px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65),
                        0 0 30px rgba(196, 30, 58, 0.07);
        }

        .contact-wrapper h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .contact-wrapper p.subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 26px;
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid #2e2e2e;
            background: #0f0f0f;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c41e3a;
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: #c41e3a;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: #e02545;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #c41e3a;
        }

        .status {
            display: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .status.success {
            display: block;
            background: rgba(46, 160, 67, 0.12);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        .status.error {
            display: block;
            background: rgba(248, 81, 73, 0.12);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        @media (max-width: 480px) {
            .contact-wrapper {
                padding: 28px 20px;
            }

            .contact-wrapper h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="contact-wrapper">
        <h1>Contact Us</h1>
        <p class="subtitle">Kami siap membantu. Isi form di bawah ini<br>untuk menghubungi tim Star Company.</p>

        <form id="contact-form" action="https://formspree.io/f/xnpndzkb" method="POST">
            <div id="status" class="status"></div>

            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="_subject" placeholder="Mau tanya tentang project...">
            </div>

            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" name="message" placeholder="Tulis pesanmu di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>

        <a href="../index.html" class="back-link">← Kembali ke Home</a>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.className = 'status';
            status.style.display = 'none';

            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    status.textContent = 'Pesan berhasil dikirim! Terima kasih.';
                    status.className = 'status success';
                    form.reset();
                } else {
                    const result = await response.json();
                    status.textContent = result.error || 'Gagal mengirim pesan. Coba lagi.';
                    status.className = 'status error';
                }
            } catch (err) {
                status.textContent = 'Terjadi kesalahan jaringan. Coba lagi.';
                status.className = 'status error';
            }
        });
    </script>
</body>
</html>
